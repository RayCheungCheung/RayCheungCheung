<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">OneDirect project visual</title>
  <desc id="desc">A stylized transit map with a geofence, bus stops, and a departure card.</desc>
  <defs>
    <pattern id="mapGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#263034" stroke-width="1"/>
    </pattern>
    <pattern id="microDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#303A3E"/>
    </pattern>
  </defs>

  <rect width="800" height="500" rx="18" fill="#0B0E10"/>
  <rect x="1" y="1" width="798" height="498" rx="17" fill="none" stroke="#2B3235"/>

  <path d="M48 58 H128" stroke="#8AE9C1" stroke-width="3"/>
  <text x="48" y="101" fill="#FF7554" font-family="'IBM Plex Mono','Cascadia Code',Consolas,monospace" font-size="14" font-weight="700" letter-spacing="3">02 / REAL-TIME TRANSIT</text>
  <text x="48" y="154" fill="#F4F1EA" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1">OneDirect</text>
  <text x="48" y="188" fill="#8F999D" font-family="'IBM Plex Mono','Cascadia Code',Consolas,monospace" font-size="15">MACAU BUS + LRT. NATIVE IOS.</text>
  <rect x="604" y="70" width="148" height="30" rx="4" fill="#111917" stroke="#8AE9C1"/>
  <text x="678" y="90" text-anchor="middle" fill="#8AE9C1" font-family="'IBM Plex Mono','Cascadia Code',Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">SWIFTUI</text>

  <g transform="translate(48 224)">
    <rect x="0" y="0" width="704" height="196" rx="8" fill="#101517" stroke="#343C3F"/>
    <rect x="1" y="1" width="702" height="194" rx="7" fill="url(#mapGrid)" opacity="0.65"/>
    <rect x="1" y="1" width="702" height="194" rx="7" fill="url(#microDots)" opacity="0.25"/>

    <path d="M-8 66 C92 48 129 113 228 98 S382 30 498 62 S641 138 738 92" fill="none" stroke="#2E3A3E" stroke-width="12"/>
    <path d="M-8 66 C92 48 129 113 228 98 S382 30 498 62 S641 138 738 92" fill="none" stroke="#4A575C" stroke-width="2"/>
    <path d="M38 204 C112 170 166 145 236 132 S398 142 470 108 S605 54 720 38" fill="none" stroke="#253135" stroke-width="8"/>
    <path d="M112 -10 C136 42 104 99 182 130 S312 168 348 210" fill="none" stroke="#263236" stroke-width="6"/>

    <path d="M18 156 C100 144 158 126 236 132 S392 142 470 108 S590 58 696 48" fill="none" stroke="#FF5C35" stroke-width="5"/>
    <circle cx="236" cy="132" r="7" fill="#0B0E10" stroke="#FF5C35" stroke-width="4"/>
    <circle cx="383" cy="132" r="6" fill="#0B0E10" stroke="#FF5C35" stroke-width="4"/>
    <circle cx="523" cy="89" r="6" fill="#0B0E10" stroke="#FF5C35" stroke-width="4"/>
    <circle cx="98" cy="146" r="5" fill="#8AE9C1"/>
    <circle cx="616" cy="57" r="5" fill="#8AE9C1"/>

    <circle cx="336" cy="105" r="58" fill="#8AE9C1" opacity="0.08" stroke="#8AE9C1" stroke-dasharray="6 6"/>
    <text x="336" y="109" text-anchor="middle" fill="#8AE9C1" font-family="'IBM Plex Mono','Cascadia Code',Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">1 KM</text>

    <rect x="512" y="18" width="172" height="66" rx="6" fill="#0D1113" stroke="#465156"/>
    <text x="528" y="39" fill="#687277" font-family="'IBM Plex Mono','Cascadia Code',Consolas,monospace" font-size="8" letter-spacing="1">NEXT DEPARTURE</text>
    <text x="528" y="66" fill="#F4F1EA" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="800">3 min</text>
    <circle cx="656" cy="51" r="10" fill="#FF5C35"/>
    <path d="M652 51 H660 M656 47 V55" stroke="#0B0E10" stroke-width="2"/>

    <rect x="18" y="18" width="126" height="28" rx="4" fill="#0D1113" stroke="#465156"/>
    <text x="31" y="36" fill="#8AE9C1" font-family="'IBM Plex Mono','Cascadia Code',Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1">MACAU / LIVE</text>
  </g>

  <text x="48" y="468" fill="#687277" font-family="'IBM Plex Mono','Cascadia Code',Consolas,monospace" font-size="12" letter-spacing="1.5">SWIFTUI  /  MAPBOX  /  GEOFENCED DEPARTURES</text>
</svg>
